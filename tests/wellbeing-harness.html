<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>民生滿意驗收</title><style>body{font:18px/1.7 sans-serif;margin:24px;max-width:1000px}button,a{padding:12px;margin:5px;display:inline-block}pre{white-space:pre-wrap}</style><h1>改善服務能否留住居民</h1><p>兩城同樣有住房、工作、備妥日用品，但高污染、髒污且缺水。只推人口評估以固定其他條件，並非整座城市經過600秒；開啟三維後才使用正常模擬。</p><button id="wait">推進39次人口評估至585秒</button><button id="water">僅改善組增建水井</button><button id="next">再推進一次人口評估</button><button id="save">儲存改善組場景</button><a href="/?storage-test=1">開啟三維隔離小鎮</a><pre id="status"></pre><script type="module">
import {Town} from '/src/simulation.js';import {addResident,tickPopulation} from '/src/city-growth.js';import {wellbeingReport} from '/src/wellbeing.js';
function make(){const t=new Town({mode:'managed'});t.time=12;t.place('home',[{x:0,z:0}],true,'residence');const home=t.buildings[0];t.place('shop',[{x:1,z:0}],true,'tea');const shop=t.buildings[1];for(const name of ['蘇安','何安']){const p=addResident(t,home);p.name=name;p.work=shop.id;p.current=shop.id;p.needsSatisfiedUntil=10000;}home.waste=40;t.city.pollution=[{x:0,z:0,value:100}];return t;}
const towns=[make(),make()];let primed=false,finished=false;function render(){document.querySelector('#status').textContent=towns.map((t,i)=>{const r=wellbeingReport(t);return `${i?'改善組':'未改善組'}：居民 ${t.people.length} 人，累計遷出 ${t.demography.departed} 人\n平均滿意 ${r.average.toFixed(1)}，住宅需求修正 ${r.demandModifier}\n${t.people.map(p=>`${p.name}：低滿意倒數 ${p.hardship?.dissatisfied||0}／600秒；${r.residents.get(p.id).parts.map(x=>`${x.name}${x.score.toFixed(1)}`).join('、')}`).join('\n')}`;}).join('\n\n');}
function census(t){t.elapsed+=15;tickPopulation(t);}
document.querySelector('#wait').onclick=()=>{if(!primed){for(let i=0;i<39;i++)for(const t of towns)census(t);primed=true;}render();};document.querySelector('#water').onclick=()=>{towns[1].place('garden',[{x:0,z:1}],true,'well');render();};document.querySelector('#next').onclick=()=>{if(primed&&!finished){for(const t of towns)census(t);finished=true;}render();};document.querySelector('#save').onclick=()=>{localStorage.setItem('bianshui-town-test-v1',JSON.stringify(towns[1]));document.querySelector('#status').textContent+='\n改善組已儲存至隔離存檔；正式城市未變更。';};render();
</script></html>
