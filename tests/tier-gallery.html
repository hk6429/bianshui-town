<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>五級建築外觀對照</title><style>body{margin:20px;background:#e8ddc5;color:#422c22;font:18px sans-serif}.gallery{display:flex}article{width:20%}canvas{width:100%;height:430px}button,a{padding:12px;font:inherit}h2{font-size:20px}</style><h1>同一座四格住宅：一至五級（相同比例）</h1><div class="gallery"></div><button id="save">儲存五級隔離測試城</button><a href="/?storage-test=1">開啟隔離測試城與重置操作</a><p id="status"></p><script type="module">
import * as THREE from 'three';import {Town} from '/src/simulation.js';import {TownScene} from '/src/scene.js';import {squareCells} from '/src/heritage.js';import {TIER_NAMES} from '/src/building-tiers.js';
const t=new Town();t.place('home',squareCells({x:0,z:0}),true,'bambooHome');
for(let tier=1;tier<=5;tier++){const a=document.createElement('article');a.innerHTML=`<h2>${tier} 級・${TIER_NAMES[tier-1]}</h2><canvas></canvas>`;document.querySelector('.gallery').append(a);const c=a.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas:c,antialias:true});renderer.setSize(c.clientWidth,430,false);renderer.setPixelRatio(devicePixelRatio);renderer.setClearColor(0xe8ddc5);const s=new THREE.Scene();s.add(new THREE.HemisphereLight(0xffffff,0x726447,3));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(10,20,10);s.add(light);const b={...t.buildings[0],tier};s.add(TownScene.prototype.buildHouse.call({},b));const aspect=c.clientWidth/430,camera=new THREE.OrthographicCamera(-10*aspect,10*aspect,10,-10,.1,150);camera.position.set(18,17,24);camera.lookAt(0,6,0);renderer.render(s,camera);}
t.buildings[0].tier=5;document.querySelector('#save').onclick=()=>{localStorage.setItem('bianshui-town-test-v1',JSON.stringify(t));document.querySelector('#status').textContent='已儲存一座五級住宅至隔離測試城；正式存檔未變更。';};
</script></html>
