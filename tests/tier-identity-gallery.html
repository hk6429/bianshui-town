<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>建築專屬五級外觀</title><style>body{margin:12px;background:#e8ddc5;color:#422c22;font:16px sans-serif}h1{font-size:24px}h2{font-size:19px;margin:12px 0 0}canvas{width:100%;height:250px;display:block}.labels{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-size:14px}select{font:inherit;padding:8px}p{margin:6px}</style><h1>建築專屬五級外觀｜同一列固定比例</h1><label>建築類型 <select id="category"><option value="home">民居</option><option value="work">工坊</option><option value="shop">商鋪</option><option value="garden">園景與公設</option></select></label><label>占地 <select id="size"><option value="4">四格</option><option value="1">一格</option></select></label><div id="gallery"></div><pre id="result"></pre><script type="module">
import * as THREE from 'three';import {TownScene} from '/src/scene.js';import {DESIGNS,squareCells} from '/src/heritage.js';import {tierAppearance} from '/src/tier-appearance.js';
const groups={home:['bambooHome','terraceHome','plumHome'],work:['dragonKiln','timberYard','dyeHouse'],shop:['bookshop','incenseShop','herbShop','cakeShop','tea','wine','textile'],garden:['pond','garden','scholarGarden','pavilion','orchard','wazi','academy','well','cleaningYard','firePost']};const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});let live=[],generation=0;
async function draw(){const run=++generation;for(const {s} of live){s.traverse(o=>{o.geometry?.dispose();});}live=[];gallery.innerHTML='';const size=Number(document.querySelector('#size').value),category=document.querySelector('#category').value;let count=0;for(const design of groups[category]){await new Promise(resolve=>requestAnimationFrame(resolve));if(run!==generation)return;const d=DESIGNS[design];if(!d.sizes.includes(size))continue;const section=document.createElement('section');section.innerHTML=`<h2>${d.name}</h2><canvas></canvas><div class="labels">${[1,2,3,4,5].map(t=>`<div>${t} 級 · ${tierAppearance({design,type:d.type,variant:d.variant},t)}</div>`).join('')}</div>`;gallery.append(section);const canvas=section.querySelector('canvas'),w=canvas.clientWidth,h=250,r=renderer;r.setPixelRatio(1);r.setSize(w,h,false);r.setScissorTest(true);r.setClearColor(0xe8ddc5);const s=new THREE.Scene();s.add(new THREE.HemisphereLight(0xffffff,0x726447,3));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-5,12,8);s.add(sun);const models=[1,2,3,4,5].map(tier=>TownScene.prototype.buildHouse.call({}, {id:1,type:d.type,design,variant:d.variant,tier,stage:4,x:0,z:0,facing:0,...(size===4?{footprint:squareCells({x:0,z:0})}:{})}));const bounds=models.map(m=>new THREE.Box3().setFromObject(m)),height=Math.max(...bounds.map(b=>b.max.y)),extent=Math.max(size===4?7:3.7,height)*.8;const camera=new THREE.OrthographicCamera(-extent*(w/5/h),extent*(w/5/h),extent,-extent,.1,100);camera.position.set(13,13,18);camera.lookAt(0,height*.4,0);for(let i=0;i<5;i++){s.add(models[i]);r.setViewport(i*w/5,0,w/5,h);r.setScissor(i*w/5,0,w/5,h);r.render(s,camera);s.remove(models[i]);}canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(r.domElement,0,0);for(const m of models)s.add(m);live.push({s});count+=5;}document.querySelector('#result').textContent=`已顯示 ${count} 個模型；每列同鏡頭、同縮放。`;}
document.querySelector('#category').onchange=draw;document.querySelector('#size').onchange=draw;draw();
</script></html>
