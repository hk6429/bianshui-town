<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>防火巡守驗收</title>
<style>body{font:18px/1.7 sans-serif;margin:24px;max-width:850px}button,a{padding:12px;margin:5px;display:inline-block}pre{white-space:pre-wrap}</style>
<h1>防火巡守驗收</h1><p>兩座隔離城市使用相同注入值觸發火警，對照有無巡守；正式遊戲使用固定日序抽樣。按鈕僅推進防火模組。</p>
<button id="warn">觸發同一火警預警</button><button id="resolve">推進30秒</button><button id="repair">推進至免費整修完成</button><button id="save">儲存無巡守場景</button><a href="/?storage-test=1">開啟三維隔離小鎮</a><pre id="status"></pre>
<script type="module">
import {Town} from '/src/simulation.js';import {tickFire,fireStatus} from '/src/fire-service.js';
const towns=[new Town({mode:'managed'}),new Town({mode:'managed'})];for(const t of towns)t.place('work',[{x:0,z:0}],true,'kiln');towns[1].place('garden',[{x:1,z:0}],true,'firePost');
function render(){document.querySelector('#status').textContent=towns.map((t,i)=>`${i?'有巡守':'無巡守'}：${fireStatus(t,t.buildings[0])}\n建築 ${t.buildings.length} 處；貨物 ${t.economy.lots.length} 件；鎮庫 ${t.city.treasury} 文`).join('\n\n');}
document.querySelector('#warn').onclick=()=>{for(const t of towns){t.time=48;tickFire(t,{draw:()=>0});}render();};document.querySelector('#resolve').onclick=()=>{for(const t of towns){t.elapsed+=30;tickFire(t);}render();};document.querySelector('#repair').onclick=()=>{for(const t of towns){t.elapsed+=120;tickFire(t);}render();};document.querySelector('#save').onclick=()=>{localStorage.setItem('bianshui-town-test-v1',JSON.stringify(towns[0]));document.querySelector('#status').textContent+='\n已儲存隔離測試城，正式小鎮未變更。';};render();
</script></html>
