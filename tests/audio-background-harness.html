<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>真實音訊前背景測試</title><h1>音訊與模擬前背景測試</h1><button id="sound">開啟真實環境音</button><p>開啟音訊後切到另一分頁至少3秒，再返回。</p><pre id="status"></pre><pre id="result">等待切頁</pre><script type="module">
import {createRuntime} from '/src/runtime.js';import {Town} from '/src/simulation.js';import {Soundscape} from '/src/sound.js';
const town=new Town();town.demo();const sound=new Soundscape();let frames=0,checkpoint=null,resumeReport=null;const status=document.querySelector('#status'),result=document.querySelector('#result');
const runtime=createRuntime({request:fn=>requestAnimationFrame(fn),cancel:id=>cancelAnimationFrame(id),hidden:()=>document.hidden,options:()=>({speed:1,paused:false}),tick:dt=>town.tick(dt),render:(dt)=>{frames++;if(resumeReport){resumeReport.firstFrameDt=dt;resumeReport.firstFrameElapsed=town.elapsed;result.textContent=JSON.stringify(resumeReport,null,2);resumeReport=null;}sound.update(town,false);status.textContent=JSON.stringify({frames,elapsed:town.elapsed,audio:sound.ctx?.state||'未啟用',gain:sound.master?.gain.value||0});},mute:()=>sound.update(town,true),onHide:()=>{checkpoint={frames,data:JSON.stringify(town),elapsed:town.elapsed,at:performance.now(),gain:sound.master?.gain.value||0};}});
document.querySelector('#sound').onclick=async()=>{await sound.toggle();document.querySelector('#sound').textContent=sound.enabled?'關閉環境音':'開啟真實環境音';};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&checkpoint)resumeReport={hiddenMs:performance.now()-checkpoint.at,backgroundFrames:frames-checkpoint.frames,unchanged:JSON.stringify(town)===checkpoint.data,beforeElapsed:checkpoint.elapsed,returnElapsed:town.elapsed,beforeGain:checkpoint.gain,backgroundGain:sound.master?.gain.value,context:sound.ctx?.state};runtime.visibility();});
</script></html>
