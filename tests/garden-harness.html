<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>園景宜居驗收</title><style>body{font:18px/1.7 sans-serif;margin:24px;max-width:950px}button,a{padding:12px;margin:5px;display:inline-block}pre{white-space:pre-wrap}</style><h1>園景距離與遞減效益</h1><p>先有住宅和一處遠方隔離花園。新增近鄰園景後比較真實住宅需求；每次按鈕使用正式建造功能。</p><button id="first">新增第一處近鄰花園</button><button id="second">新增第二處近鄰花園</button><button id="third">新增第三處近鄰花園</button><button id="save">儲存園景場景</button><a href="/?storage-test=1">開啟三維隔離小鎮</a><pre id="status"></pre><script type="module">
import {Town} from '/src/simulation.js';import {gardenBenefit,gardenReport} from '/src/garden-services.js';import {cityDemand} from '/src/city-growth.js';
const t=new Town({mode:'managed'});t.place('home',[{x:0,z:0}],true,'residence');const home=t.buildings[0];t.place('garden',[{x:-7,z:0}],true,'garden');
function render(){const r=gardenBenefit(t,home),d=cityDemand(t);document.querySelector('#status').textContent=`可用園景 ${gardenReport(t).gardens} 處；住宅範圍內 ${r.sources.length} 處\n宜居加成 ${r.score.toFixed(3)}／20\n住宅需求 ${d.home.score}；人口目標 ${d.targetPopulation}\n各處原始效益 ${r.sources.map(s=>s.value.toFixed(3)).join('、')||'無'}\n金庫 ${t.city.treasury} 文`;}
for(const [id,x,z]of [['first',1,0],['second',-1,0],['third',0,1]])document.querySelector('#'+id).onclick=()=>{t.place('garden',[{x,z}],true,'garden');render();};document.querySelector('#save').onclick=()=>{localStorage.setItem('bianshui-town-test-v1',JSON.stringify(t));document.querySelector('#status').textContent+='\n已儲存隔離測試城；正式存檔未變更。';};render();
</script></html>
