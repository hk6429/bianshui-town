<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>小卡更新驗收</title><style>body{font:18px sans-serif;margin:24px}#panel{height:160px;overflow:auto;border:2px solid #765;padding:12px;width:420px}button{padding:12px;font:inherit}</style><h1>動態小卡焦點與捲動</h1><button id="run">執行20次更新與重排</button><div id="panel"><div id="content"></div></div><pre id="result"></pre><script type="module">
import {patchPanel} from '/src/panel-dom.js';const panel=document.querySelector('#panel'),content=document.querySelector('#content');
function html(n,reverse=false){return `<h2>測試住宅</h2><p>在場 ${n} 人</p>${Array.from({length:12},(_,i)=>`<p>生活紀錄${i}：${n}</p>`).join('')}<div class="building-tools"><button data-manage="move" data-building="1">搬移</button><button data-manage="upgrade" data-building="1">升級 ${n}</button></div><div>${(reverse?[3,2,1]:[1,2,3]).map(i=>`<button data-resident="${i}">居民${i}</button>`).join('')}</div>`;}
patchPanel(content,html(0),panel);
document.querySelector('#run').onclick=()=>{const target=content.querySelector('[data-manage="upgrade"]');target.focus();const before=panel.scrollTop;for(let n=1;n<=20;n++)patchPanel(content,html(n),panel);const first={sameNode:target===content.querySelector('[data-manage="upgrade"]'),focus:document.activeElement===target,scrollBefore:before,scrollAfter:panel.scrollTop,text:target.textContent};const person=content.querySelector('[data-resident="2"]');person.focus();patchPanel(content,html(21,true),panel);document.querySelector('#result').textContent=JSON.stringify({updates:first,reorder:{sameNode:person===content.querySelector('[data-resident="2"]'),focus:document.activeElement===person,order:[...content.querySelectorAll('[data-resident]')].map(b=>b.dataset.resident)}},null,2);};
</script></html>
