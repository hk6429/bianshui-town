<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>書院教育驗收</title><style>body{font:18px/1.7 sans-serif;margin:24px;max-width:1000px}button,a{padding:12px;margin:5px;display:inline-block}pre{white-space:pre-wrap}</style><h1>書院覆蓋與工匠真產能</h1><p>兩座隔離城市各有四名到場工匠及一份泥料。此頁只推進教育或生產模組，方便固定其他條件比較；三維小鎮使用正常遊戲時間。</p><button id="half">教育推進30秒</button><button id="day">教育推進一日</button><button id="max">教育再推進十日</button><button id="produce">生產推進8.5秒</button><button id="save">儲存書院場景</button><a href="/?storage-test=1">開啟三維隔離小鎮</a><pre id="status"></pre><script type="module">
import {Town} from '/src/simulation.js';import {squareCells} from '/src/heritage.js';import {addResident} from '/src/city-growth.js';import {tickEducation,educationReport,educationOf,craftEducationMultiplier} from '/src/education.js';import {transfer,tickProduction} from '/src/production.js';
function make(covered){const t=new Town({mode:'managed'});t.place('home',[{x:0,z:0}],true,'residence');const home=t.buildings.at(-1);t.place('work',[{x:-1,z:0}],true,'kiln');const work=t.buildings.at(-1);if(covered)t.place('garden',squareCells({x:1,z:0}),true,'academy');for(let i=0;i<4;i++){const p=addResident(t,home);p.work=work.id;p.current=work.id;p.name=['蘇安','何寧','林平','陳和'][i];}transfer(t,'boat',`input:${work.id}`,1,'clay');return {t,work};}
const towns=[make(false),make(true)];function render(){document.querySelector('#status').textContent=towns.map(({t,work},i)=>{const r=educationReport(t),lot=t.economy.lots.find(l=>l.at===`input:${work.id}`||l.at===`output:${work.id}`);return `${i?'有書院':'無書院'}：學力 ${t.people.map(p=>educationOf(p).toFixed(3)).join('、')}\n受教 ${r.assigned.size} 人；學力產能加成 ${((craftEducationMultiplier(t,work)-1)*100).toFixed(2)}％\n貨物 ${lot.good==='ceramics'?'已製成陶器':'泥料加工中'}；加工進度 ${(lot.progress||0).toFixed(3)}；貨物位置 ${lot.at}`;}).join('\n\n');}
function education(seconds){for(const {t}of towns)for(let elapsed=0;elapsed<seconds;elapsed+=30)tickEducation(t,30);render();}
document.querySelector('#half').onclick=()=>education(30);document.querySelector('#day').onclick=()=>education(360);document.querySelector('#max').onclick=()=>education(3600);document.querySelector('#produce').onclick=()=>{for(const {t}of towns)tickProduction(t,8.5);render();};document.querySelector('#save').onclick=()=>{localStorage.setItem('bianshui-town-test-v1',JSON.stringify(towns[1].t));document.querySelector('#status').textContent+='\n已儲存隔離測試城；正式小鎮未變更。';};render();
</script></html>
