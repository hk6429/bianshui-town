<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>五級功能驗收</title><style>body{font:18px/1.7 sans-serif;margin:24px;max-width:1000px}button,a{padding:12px;margin:5px;display:inline-block}pre{white-space:pre-wrap}</style><h1>二級與三級：相同人力實際收益</h1><p>控制頁只推進指定生產或銷售模組。三維測試城使用20000文驗收資金，供逐級點按；不變更正式城市。</p><button id="work">相同四人加工6.5秒</button><button id="sales">相同兩人營業20秒</button><button id="save">儲存二級三維測試城</button><a href="/?storage-test=1">開啟三維隔離小鎮</a><pre id="status"></pre><script type="module">
import {Town} from '/src/simulation.js';import {addResident} from '/src/city-growth.js';import {upgradeBuilding} from '/src/urban.js';import {transfer,tickProduction} from '/src/production.js';import {sellAtShop} from '/src/commerce.js';import {buildingAbility,buildingStats} from '/src/building-tiers.js';
function model(type,tier){const t=new Town({mode:'managed'});t.city.treasury=20000;t.place('home',[{x:0,z:0}],true,'residence');const home=t.buildings.at(-1);t.place(type,[{x:1,z:0}],true,type==='work'?'kiln':'tea');const b=t.buildings.at(-1);for(let i=0;i<(type==='work'?4:2);i++){const p=addResident(t,home);p.work=b.id;p.current=b.id;}for(let i=1;i<tier;i++)upgradeBuilding(t,b.id);if(type==='work')transfer(t,'boat',`input:${b.id}`,1,'clay');else{for(const l of t.economy.lots)l.good='cloth';transfer(t,'boat',`shop:${b.id}`,12,'cloth');t.time=12;}return {t,b};}
const works=[model('work',2),model('work',3)],shops=[model('shop',2),model('shop',3)];let worked=false,sold=false;
function render(){document.querySelector('#status').textContent=[...works,...shops].map(({t,b})=>`${b.tier}級${b.type==='work'?'作坊':'商鋪'}：${buildingAbility(b)}；每日維護 ${buildingStats(b).upkeep} 文\n已製成陶器 ${t.economy.lots.filter(l=>l.good==='ceramics').length}；已售布匹 ${t.economy.sold.cloth||0}`).join('\n\n');}
document.querySelector('#work').onclick=()=>{if(!worked){for(const {t}of works)tickProduction(t,6.5);worked=true;}render();};document.querySelector('#sales').onclick=()=>{if(!sold){for(let seconds=0;seconds<=20;seconds++)for(const {t,b}of shops){t.elapsed=seconds;sellAtShop(t,b,'cloth');}sold=true;}render();};
document.querySelector('#save').onclick=()=>{const {t,b}=model('work',2);const home=t.buildings[0];upgradeBuilding(t,home.id);t.place('shop',[{x:-1,z:0}],true,'tea');upgradeBuilding(t,t.buildings.at(-1).id);localStorage.setItem('bianshui-town-test-v1',JSON.stringify(t));document.querySelector('#status').textContent+='\n已儲存二級住宅、作坊、商鋪至隔離存檔。';};render();
</script></html>
