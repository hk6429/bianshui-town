<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>隔離存檔測試</title><h1>隔離存檔測試</h1><p>只操作 bianshui-town-test-v1；不改正式小鎮。</p><button id="seed">建立測試城</button><button id="managed">建立經營空城</button><button id="damage">放入損壞測試檔</button><button id="refresh">讀取測試狀態</button><a href="/?storage-test=1">開啟隔離小鎮</a><pre id="status"></pre><script type="module">
import {Town} from '/src/simulation.js';const key='bianshui-town-test-v1',out=document.querySelector('#status');function refresh(){const raw=localStorage.getItem(key);let description;try{const p=JSON.parse(raw),d=p?.data||p;description=d?`${d.buildings.length} 建築／${d.people.length} 居民`:'尚無存檔';}catch{description='損壞文字：'+raw;}out.textContent=description+'\n救援檔：'+(localStorage.getItem(key+':quarantine')||'無')+'\n重置備份：'+(localStorage.getItem(key+':reset')?'有':'無');}
document.querySelector('#seed').onclick=()=>{const t=new Town();t.demo();localStorage.setItem(key,JSON.stringify(t));localStorage.setItem(key+':backup',JSON.stringify(t));refresh();};document.querySelector('#managed').onclick=()=>{const t=new Town({mode:'managed'});localStorage.setItem(key,JSON.stringify(t));refresh();};document.querySelector('#damage').onclick=()=>{localStorage.setItem(key,'{damaged-test');refresh();};document.querySelector('#refresh').onclick=refresh;refresh();
</script></html>
