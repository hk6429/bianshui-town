<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>衛生與欠款驗收</title>
<style>body{font:18px/1.7 sans-serif;margin:24px;max-width:850px}button,a{padding:10px;margin:5px;display:inline-block}pre{white-space:pre-wrap}</style>
<h1>衛生與欠款驗收</h1><p>隔離場景：四位住戶、水井與清運院。逐日按鈕只執行正式財政與衛生結算，不推進其他居民排程。</p>
<button id="next">結算一天</button><button id="connect">接通清運道路</button><button id="cut">拆除清運道路</button><button id="debt">情境：零稅率零鎮庫</button><button id="tax">調整稅率為20％</button><button id="save">儲存隔離場景</button><a href="/?storage-test=1">開啟三維隔離小鎮</a><pre id="status"></pre>
<script type="module">
import {Town} from '/src/simulation.js';import {addResident} from '/src/city-growth.js';import {layRoad,removeRoad} from '/src/urban.js';import {sanitationReport,tickSanitation} from '/src/sanitation.js';import {waterReport} from '/src/water-service.js';import {setCityPolicy,settleBudget} from '/src/city-finance.js';
const t=new Town({mode:'managed'});t.place('home',[{x:0,z:0}],true,'residence');for(let i=0;i<4;i++)addResident(t,t.buildings[0]);t.place('garden',[{x:1,z:0}],true,'well');t.place('garden',[{x:-2,z:0}],true,'cleaningYard');
function render(){const s=sanitationReport(t),w=waterReport(t);document.querySelector('#status').textContent=`第 ${Math.floor(t.time/24)+1} 日；鎮庫 ${t.city.treasury} 文，欠款連續 ${t.city.deficitDays} 日，稅率 ${t.city.taxRate}％\n積存髒污 ${s.waste} 份；衛生 ${s.hygiene}／100；平均健康 ${s.health}／100\n服務效率 ${s.efficiency*100}％；清運容量 ${s.yards[0].capacity} 份；供水 ${w.served}／${w.residents} 人。` ;}
document.querySelector('#next').onclick=()=>{t.time+=24;settleBudget(t);tickSanitation(t);render();};document.querySelector('#connect').onclick=()=>{layRoad(t,'lane',[{x:-1,z:0}]);render();};document.querySelector('#cut').onclick=()=>{removeRoad(t,[{x:-1,z:0}]);render();};document.querySelector('#debt').onclick=()=>{t.city.treasury=0;setCityPolicy(t,{taxRate:0});render();};document.querySelector('#tax').onclick=()=>{setCityPolicy(t,{taxRate:20});render();};document.querySelector('#save').onclick=()=>{localStorage.setItem('bianshui-town-test-v1',JSON.stringify(t));document.querySelector('#status').textContent+='\n隔離場景已儲存；正式小鎮未變更。';};render();
</script></html>
