<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>工坊污染驗收</title><style>body{font:18px/1.7 sans-serif;margin:24px;max-width:950px}button,a{padding:12px;margin:5px;display:inline-block}pre{white-space:pre-wrap}</style><h1>真實成品、距離暴露與停工恢復</h1><p>固定四名居民，窯坊每完成一件陶器才排放。此頁只推進生產或污染模組，以固定人口等條件；隔離三維小鎮則使用正常模擬。</p><button id="produce">完成一件陶器</button><button id="stop">停工並推進90秒</button><button id="move">搬移窯坊至遠處</button><button id="save">儲存污染場景</button><a href="/?storage-test=1">開啟三維隔離小鎮</a><pre id="status"></pre><script type="module">
import {Town} from '/src/simulation.js';import {addResident,cityDemand} from '/src/city-growth.js';import {transfer,tickProduction} from '/src/production.js';import {tickPollution,pollutionAt,pollutionReport} from '/src/pollution.js';import {moveBuilding} from '/src/urban.js';
const t=new Town({mode:'managed'});t.place('work',[{x:0,z:0}],true,'kiln');const work=t.buildings.at(-1);t.place('home',[{x:1,z:0}],true,'residence');const home=t.buildings.at(-1);t.place('home',[{x:-4,z:0}],true,'residence');const far=t.buildings.at(-1);for(let i=0;i<4;i++){const p=addResident(t,home);p.work=work.id;p.current=work.id;}transfer(t,'boat',`input:${work.id}`,4,'clay');
function render(){const r=pollutionReport(t);document.querySelector('#status').textContent=`居民 ${t.people.length} 人；完成陶器 ${t.economy.lots.filter(l=>l.good==='ceramics').length} 件\n相鄰住宅污染 ${pollutionAt(t,home).toFixed(3)}／100；遠處住宅污染 ${pollutionAt(t,far).toFixed(3)}／100\n住宅平均暴露 ${r.exposure.toFixed(3)}；居住環境 ${r.environment.toFixed(3)}／100\n污染透過民生滿意影響入住；住宅需求 ${cityDemand(t).home.score}\n窯坊位置 (${work.x},${work.z})；貨物守恆 ${t.economy.lots.length+t.economy.archived}／${t.economy.imported}`;}
document.querySelector('#produce').onclick=()=>{tickProduction(t,20);render();};document.querySelector('#stop').onclick=()=>{for(const p of t.people){p.current=home.id;p.outside=false;}for(let i=0;i<3;i++){tickProduction(t,30);tickPollution(t,30);}render();};document.querySelector('#move').onclick=()=>{moveBuilding(t,work.id,{x:-7,z:0});render();};document.querySelector('#save').onclick=()=>{localStorage.setItem('bianshui-town-test-v1',JSON.stringify(t));document.querySelector('#status').textContent+='\n已儲存隔離測試城；正式存檔未變更。';};render();
</script></html>
